[package]
name = "quran-desktop"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "quran"
path = "src/main.rs"

[dependencies]
quran-core = { path = "../quran-core" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }
pango = { version = "0.22", features = ["v1_56"] }
pangocairo = "0.22"
adw = { package = "libadwaita", version = "0.9", features = ["v1_9", "gtk_v4_22"] }
gst = { package = "gstreamer", version = "0.25" }
gst-play = { package = "gstreamer-play", version = "0.25" }
tokio = { version = "1", features = ["rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mpris-server = "0.10"
