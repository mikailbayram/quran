[package]
name = "quran-core"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip", "brotli", "stream"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "fs", "io-util", "sync", "macros"] }
thiserror = "2"
directories = "6"
futures = "0.3"
wuff = "0.2"
